name = "b1s"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["B1s"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "B1s"

# Palomar submission surface (9/14): the Mathlib-only statement of record and the re-export of
# the development that proves it. See Challenge.lean, Solution.lean, comparator.json.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
