      module: "Challenge (statement), Solution / B1s.fried_counterexample_main (proof)"
      status: proved
      note: "Conditional on the sixteen binders; conclusion includes uniqueness of σ, ζ-order 0, the slope bound, and the Lemma A torsion identity."
    - source: "Input (B), joint C³ regularity of the cluster matrices"
      lean: "FriedCrossing.ClusterFrame.clusterC3_of_resolvent"
      module: "B1s.cluster_from_resolvent_9_11 (not compared)"
      status: proved
      note: "Derived from the resolvent-family fields via C^k-with-loss on the scale (resolvent_scale_9_11) and a parametric interval integral; this is why the compared theorem has no regularity hypothesis."
    - source: "The cluster matrices M (2×2) and A (4×4), the twin, the pure-zero branch, the zero clusters C₀¹, C₀²"
      lean: "FriedCrossing.ClusterFrame.Mreal, TwinRate.twin, Branch.zBranch, Derived.resZero₁, Derived.resZero₂"
      module: "Challenge (definitions), B1s.fried_statement_defs_9_14 (development)"
      status: proved
      note: "Definitions; see fidelity (i)–(v)."
