fidelity:
  divergences: >-
    The formal theorem is universally quantified over abstract data satisfying the sixteen hypotheses;
    the informal claim is existential (a manifold, a character family and a metric at which
    ζ(0; g_σ) ≠ τ_R). The gap between them is exactly the geometric identification, which is not
    formalized: nothing in Lean asserts that data satisfying all sixteen binders exist, and the binder
    docstrings are where each fact is attributed to its source. Specific points. (i) M and A are defined
    as REAL PARTS of the complex frame matrices A(p)⁻¹B(p); that the imaginary parts vanish (conjugation
    symmetry of the cluster) is interpretive and not consumed by the proof. (ii) The frames are assumed
    nondegenerate (hdet₁, hdet₂: det A(p) ≠ 0 for all p); informally this is the choice of a dual frame
    at (0,0) with the parameters retracted into the region where it stays invertible. (iii) The
    resolvent families are stated globally in the parameter (θ,τ,λ) ∈ (ℝ×ℝ)×ℂ; informally they are the
    pull-backs by smooth retractions of (θ,τ) into a neighbourhood of (0,0) and of λ into an annulus
    around the fixed contour where the resolvent exists (CDDP §4.2). (iv) hstates (two linearly
    independent states at s*(θ)) is derived in the accompanying note from DGRS (7.6) and a Liouville
    argument on S², not read verbatim from a paper; it is the only hypothesis with that status.
    (v) The degree-3 space V₃ is abstract: only its dimension enters (rank–nullity), and no degree-3
    cluster matrix is in the ledger; C₀¹ and C₀² are the generalized 0-eigenspaces of M and A, whose
    dimensions are the algebraic multiplicities of 0 by Mathlib's finrank_maxGenEigenspace_eq.
    (vi) Every HasDerivAt / ContDiff hypothesis is stated globally on ℝ or ℝ×ℝ rather than on a ball, as
    a C^k function on a ball restricted to a smaller closed ball extends to the plane. (vii) The
    conclusion's torsion identity is stated for the explicit 2×2 / 3×3 matrices of the (x,l)-cluster
    complex (Chaubet–Dang Def 3.2 in the normalisation of the note's Lemma A), not for an abstract
    chain complex.

sources:
  - title: "A codimension-one failure of Fried's identity for acyclic characters on nearly hyperbolic 3-manifolds"
    authors: ["Benjamin Lawton"]
    type: original-proof
    location: "Zenodo, restricted deposit of 2026-09-08, version 0.1, https://doi.org/10.5281/zenodo.22650834; figures companion docs/counterexample_intuitive_view.pdf (source .tex alongside) in this repository"
    relationship: other
    author_endorsement: participated
    note: >-
      The informal account. Its figures companion, docs/counterexample_intuitive_view.pdf, draws the
      mechanism (the two dials θ and τ, the twin, the unequal arrival speeds, the jump in ζ(0)) in the
      branch vocabulary of Challenge.lean and is readable without the restricted deposit. It states the theorem, the five analytic inputs with their scope and
      status, the Lean ledger, and an AI-use disclosure; it derives hstates (independence of d₀f and
      I·d₀f) and Lemma A (zero-cluster torsion = limit ratio of arriving zeros and poles). Deposited
      with restricted access pending independent expert reading of the analytic inputs. The deposited
      version 0.1 predates the 9/10–9/14 restructuring of the Lean ledger (cluster matrices as primitives,
      input (B) derived from the resolvent families, hsemisimple replaced by hstates); its theorem and
      mechanism are those formalized here, its input list is the earlier five-input form. The figures
      companion in docs/ is current. Novelty of the
      counterexample is not established; the author makes no priority claim beyond the deposit
      timestamp.
