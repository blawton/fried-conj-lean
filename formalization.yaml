automation:
  methods:
    - method: agent
      models: ["claude-fable-5-1"]
      framework: "Claude Code"
      role: >-
        The formalization: the Lean text of the leg files, the statement file, the statement-definitions
        module, Challenge.lean (generated by scripts/make_challenge.py), Solution.lean and this metadata
        draft; Mathlib search and tactic development; the #print axioms audits; the local comparator
        runs. Also the literature extraction, derivation, adversarial checking and blind re-derivation
        described in the informal account's disclosure, and its drafting. Directed turn by turn by the
        author, who chose the targets, fixed the ledger discipline (one binder per cited fact, no
        axioms, built-ins only) and selected what to keep.
    - method: manual
      models: []
      role: >-
        Direction, selection and responsibility. Benjamin Lawton chose the problem and the reduction's
        shape, read the cited papers against the ledger rows, decided every change to the hypothesis
        list, and releases the repository. He takes responsibility for the mathematics.
  spend_usd: "subscription-based Claude Code usage; per-project spend not recorded separately"
  notes: >-
    Mechanical checks run locally before submission: lake build of the whole suite; #print axioms on
    the compared declaration ([propext, Classical.choice, Quot.sound]); leanprover/comparator (tag
    v4.33.0) on comparator.json with Challenge.lean generated from B1s/fried_statement_defs_9_14.lean.
    The statement's definitions are kept in one module because comparator compares definitions by
    value and Lean's per-module cache of lifted auxiliary proofs (numerals ⇒ Nat.AtLeastTwo instances)
    otherwise gives the same definition different auxiliary constants in the two environments.
    scripts/ledger_check.py checks that the README's ledger table and the theorem's binders are in
    one-to-one correspondence.

review:
  status: agent-reviewed
  notes: >-
    No independent human mathematician has reviewed the development or the informal account. The
    author has read the cited papers against each ledger row (the [V]/[D]/[def] status column of the
    README) but has not independently verified informal-to-formal fidelity beyond that. Model-side
    checks: the construction was attacked along five lines by a second model instance and re-derived
    from the cited texts by a third with no access to the earlier derivations, and the three agree
    (informal account, Disclosure). What is established mechanically: the compared declaration is proved
    from the three standard axioms, and comparator matches it constant by constant against Challenge.lean.

limitations:
  - >-
    The theorem is a reduction. Its hypotheses are the cited facts; that the geodesic-flow data satisfy
    them at once is not formalized and not independently verified. If the hypotheses were jointly
    unsatisfiable the theorem would still hold and would say nothing about Fried's conjecture.
  - >-
    Only hstates is derived rather than read verbatim from a source (independence of d₀f and I·d₀f at
    s*(θ), a Liouville argument on S² in the informal account). The frame nondegeneracy hdet₁, hdet₂ and
    the global-parameter statement of the resolvent families are choices, described in fidelity.
  - >-
    The counterexample is to Fried's identity at a codimension-one, non-generic metric where
    zero-resonant states exist with cancelling multiplicities, so ζ is regular at 0. The refined
    identity of Chaubet–Dang Thm 4 holds there; readers who reserve "Fried's conjecture" for the
    resonance-free case will read the result as an instance of that refined identity rather than as a
    counterexample.
  - >-
    The repository proves more than is compared (the uncompared fried_counterexample_of_inputs, the
    per-leg theorems, and the separate kinetic-gap programme in the other files). One file of that
    programme, b1_spectral_skeleton_8_12, declares quarantined axioms; nothing compared reaches them.
  - >-
    Novelty is unknown. No systematic prior-art search has been run beyond the cited literature; the
    author makes no priority claim beyond the restricted Zenodo deposit.

